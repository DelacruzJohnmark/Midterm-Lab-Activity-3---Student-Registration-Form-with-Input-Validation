<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-content"><div class="cap-icon">🎓</div><div>
    <h1>Student Registration Form</h1><p>With Input Validation</p>
  </div></div>
</header>

<main class="container">
<section class="card">
<div class="card-title"><h2>Student Registration Form</h2></div>

<form id="registrationForm" novalidate>
<div class="form-grid">
  <div class="form-group">
    <label for="fullName">Full name <span>*</span></label>
    <input id="fullName" name="fullName" type="text" placeholder="Enter full name" autocomplete="name" aria-describedby="fullNameError">
    <p id="fullNameError" class="error-message" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="studentNumber">Student number <span>*</span></label>
    <input id="studentNumber" name="studentNumber" type="text" placeholder="24-1234-12" inputmode="numeric" aria-describedby="studentNumberError">
    <p id="studentNumberError" class="error-message" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="email">Email address <span>*</span></label>
    <input id="email" name="email" type="email" placeholder="Enter email address" autocomplete="email" aria-describedby="emailError">
    <p id="emailError" class="error-message" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="mobileNumber">Mobile number <span>*</span></label>
    <input id="mobileNumber" name="mobileNumber" type="tel" placeholder="09171234567 or +639171234567" inputmode="tel" aria-describedby="mobileNumberError">
    <p id="mobileNumberError" class="error-message" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="password">Password <span>*</span></label>
    <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="new-password" aria-describedby="passwordError passwordFeedback">
    <p id="passwordError" class="error-message" role="alert"></p>
    <p id="passwordFeedback" class="feedback" aria-live="polite"></p>
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirm password <span>*</span></label>
    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" aria-describedby="confirmPasswordError">
    <p id="confirmPasswordError" class="error-message" role="alert"></p>
  </div>

  <div class="form-group">
    <label for="course">Course <span>*</span></label>
    <select id="course" name="course" aria-describedby="courseError">
      <option value="">Select your course</option>
      <option value="BSIT">BSIT</option>
      <option value="BSCS">BSCS</option>
    </select>
    <p id="courseError" class="error-message" role="alert"></p>
  </div>

  <div class="terms-group">
    <input id="terms" name="terms" type="checkbox" aria-describedby="termsError">
    <label for="terms">I agree to the terms and conditions. <span>*</span></label>
    <p id="termsError" class="error-message" role="alert"></p>
  </div>
</div>

<div class="button-row">
  <button id="registerBtn" class="primary-btn" type="submit">Register</button>
  <button id="resetBtn" class="secondary-btn" type="reset">Reset</button>
</div>
</form>

<section id="successMessage" class="success-message" role="status" aria-live="polite"></section>
<section id="registrationSummary" class="summary" aria-live="polite">
<h2>Registration Summary</h2>
<div class="summary-grid">
  <div class="summary-item"><span>Full name</span><strong id="summaryName"></strong></div>
  <div class="summary-item"><span>Student number</span><strong id="summaryStudentNumber"></strong></div>
  <div class="summary-item"><span>Email address</span><strong id="summaryEmail"></strong></div>
  <div class="summary-item"><span>Mobile number</span><strong id="summaryMobileNumber"></strong></div>
  <div class="summary-item"><span>Course</span><strong id="summaryCourse"></strong></div>
</div>
</section>
</section>
</main>
<script src="js/app.js"></script>
</body>
</html>
